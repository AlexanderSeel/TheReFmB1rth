name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host safety and DSP tests
        run: tests/run_host_tests.sh
      - name: Validate redistributable sample manifest
        run: python3 tools/fetch_samples.py --validate-only
      - name: Prepare pinned Felucca baseline
        run: tools/bootstrap_felucca.sh .upstream/felucca
      - name: Verify Felucca integration anchors
        run: python3 tools/verify_felucca_integration.py .upstream/felucca
      - name: Apply deterministic TheReFmB1rth overlay
        run: |
          python3 tools/apply_felucca_overlay.py .upstream/felucca --check
          python3 tools/patch_fm1_rebirth_ui.py .upstream/felucca
      - name: Verify overlay stamp and patched anchors
        run: |
          test -s .upstream/felucca/.refm-overlay
          test -s .upstream/felucca/.refm-ui-overlay
          grep -q 'refm_felucca_audio_block(out, n);' .upstream/felucca/firmware/src/audio.c
          grep -q 'REFM_MIRROR_MIDI(pkt);' .upstream/felucca/firmware/src/usb.c
          grep -q '#define REFM_APP 1' .upstream/felucca/firmware/src/felucca.c
          grep -q 'refm_platform_storage_save' .upstream/felucca/firmware/src/felucca.c
          grep -q 'Compact dual-bassline visual language' .upstream/felucca/firmware/src/ui_graph.c
          grep -q '\*refm_objs' .upstream/felucca/tools/build.py
      - name: Compile and link copied ReFmB1rth target sources
        run: |
          mkdir -p build/host/overlay
          i=0
          while IFS= read -r src; do
            cc -std=c11 -Wall -Wextra -Werror -O2 \
              -DREFM_FELUCCA_PLATFORM=1 \
              -I.upstream/felucca/firmware/refm/proto \
              -I.upstream/felucca/firmware/refm/integration \
              -c ".upstream/felucca/firmware/refm/$src" \
              -o "build/host/overlay/refm_$i.o"
            i=$((i+1))
          done < .upstream/felucca/firmware/refm/sources.txt
          cat > build/host/overlay/platform_stubs.c <<'EOF'
          #include <stdint.h>
          int refm_platform_storage_save(uint32_t slot, const void *src, uint32_t len) { (void)slot; (void)src; (void)len; return -1; }
          int refm_platform_storage_load(uint32_t slot, void *dst, uint32_t max) { (void)slot; (void)dst; (void)max; return -1; }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -O2 \
            -I.upstream/felucca/firmware/refm/proto \
            -I.upstream/felucca/firmware/refm/integration \
            tests/test_felucca_bridge.c build/host/overlay/platform_stubs.c \
            build/host/overlay/refm_*.o -o build/host/overlay/test_overlay_link
          build/host/overlay/test_overlay_link
