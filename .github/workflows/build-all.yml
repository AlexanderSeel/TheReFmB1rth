name: Build all artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run DSP, integration and safety tests
        run: tests/run_host_tests.sh

  wasm:
    name: WASM engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Fetch approved CC0 drum samples
        run: python3 tools/fetch_samples.py
      - name: Preprocess compact audition assets
        run: python3 tools/preprocess_samples.py --rate 22050
      - name: Enforce conservative FM-1 sample candidate budget
        run: python3 tools/check_sample_budget.py build/samples/processed/manifest.json --output build/wasm/target-sample-budget.json
      - name: Build shared ReFmB1rth WASM runtime
        run: sh web/emu/build_wasm.sh
      - name: Smoke-check browser harness
        run: |
          test -s build/wasm/index.html
          test -s build/wasm/worklet.html
          test -s build/wasm/worklet_client.js
          test -s build/wasm/refm_audio_worklet.js
          test -s build/wasm/refm.js
          test -s build/wasm/refm.wasm
          test -s build/wasm/sample_controls.js
          test -s build/wasm/sample-manifest.json
          test -s build/wasm/sample-lock.json
          test -s build/wasm/target-sample-budget.json
          grep -q "import createRefm from './refm.js'" build/wasm/index.html
          grep -q "sample_controls.js" build/wasm/index.html
          grep -q "ReFmWorkletClient" build/wasm/worklet.html
          grep -q "registerProcessor('refm-audio'" build/wasm/refm_audio_worklet.js
          grep -q "_refm_wasm_render" build/wasm/refm.js
          grep -q "_refm_wasm_enable_samples" build/wasm/refm.js
      - name: Record checksums
        run: sha256sum build/wasm/index.html build/wasm/worklet.html build/wasm/worklet_client.js build/wasm/refm_audio_worklet.js build/wasm/refm.js build/wasm/refm.wasm build/wasm/sample_controls.js build/wasm/sample-manifest.json build/wasm/sample-lock.json build/wasm/target-sample-budget.json > build/wasm/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: refm-wasm-${{ github.sha }}
          path: |
            build/wasm/index.html
            build/wasm/worklet.html
            build/wasm/worklet_client.js
            build/wasm/refm_audio_worklet.js
            build/wasm/refm.js
            build/wasm/refm.wasm
            build/wasm/sample_controls.js
            build/wasm/sample-manifest.json
            build/wasm/sample-lock.json
            build/wasm/target-sample-budget.json
            build/wasm/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  fm1-target:
    name: FM-1 target package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git xz-utils python3-pip
          python3 -m pip install --user Pillow fonttools
      - name: Prepare exact Felucca 1.0.5 foundation
        run: tools/bootstrap_felucca.sh .upstream/felucca
      - name: Verify pinned Felucca integration anchors
        run: python3 tools/verify_felucca_integration.py .upstream/felucca
      - name: Apply deterministic ReFmB1rth overlay
        run: python3 tools/apply_felucca_overlay.py .upstream/felucca --check
      - name: Download JieLi pi32v2 toolchain
        run: .upstream/felucca/tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Fetch pinned AC79 SDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          SDK_TAG=AC79NN_SDK_V1.2.1_2023-12-13
          SDK_DIR="$RUNNER_TEMP/ac79"
          for attempt in 1 2 3; do
            rm -rf "$SDK_DIR"
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 clone --depth 1 --single-branch --branch "$SDK_TAG" "$SDK_URL" "$SDK_DIR"; then
              git -C "$SDK_DIR" rev-parse HEAD
              exit 0
            fi
            echo "AC79 SDK fetch attempt $attempt failed"
            sleep $((attempt * 5))
          done
          echo "AC79 SDK fetch failed after 3 attempts" >&2
          exit 1
      - name: Build FM-1 app, loader and FWSC package
        working-directory: .upstream/felucca
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
          AC79_SDK: ${{ runner.temp }}/ac79
        run: ./build.sh
      - name: Enforce FM-1 target memory budgets
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
        run: |
          mkdir -p build/target
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t .upstream/felucca/build/felucca.elf > build/target/felucca.syms
          python3 tools/check_target_budget.py .upstream/felucca/build/felucca.bin build/target/felucca.syms --output build/target/target-memory.json
      - name: Create and verify experimental release manifest
        run: |
          cp .upstream/felucca/build/felucca.fwsc build/target/TheReFmB1rth-experimental.fwsc
          cp .upstream/felucca/build/felucca.bin build/target/TheReFmB1rth-app.bin
          cp .upstream/felucca/build/loader/ota.bin build/target/ota.bin
          cp .upstream/felucca/.refm-overlay build/target/refm-overlay.txt
          python3 tools/release_manifest.py build/target/TheReFmB1rth-experimental.fwsc --commit "${GITHUB_SHA}" --output build/target/manifest.json
          python3 tools/release_manifest.py build/target/TheReFmB1rth-experimental.fwsc --verify build/target/manifest.json
          sha256sum build/target/TheReFmB1rth-experimental.fwsc build/target/TheReFmB1rth-app.bin build/target/ota.bin > build/target/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: refm-fm1-experimental-${{ github.sha }}
          path: |
            build/target/TheReFmB1rth-experimental.fwsc
            build/target/TheReFmB1rth-app.bin
            build/target/ota.bin
            build/target/manifest.json
            build/target/refm-overlay.txt
            build/target/SHA256SUMS
            build/target/target-memory.json
            build/target/felucca.syms
          if-no-files-found: error
          retention-days: 14
