name: Build all artifacts

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'hardware-test-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run DSP, integration and safety tests
        run: tests/run_host_tests.sh

  wasm:
    name: WASM engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Fetch approved CC0 drum samples
        run: python3 tools/fetch_samples.py
      - name: Preprocess compact audition assets
        run: python3 tools/preprocess_samples.py --rate 22050
      - name: Enforce conservative FM-1 sample candidate budget
        run: python3 tools/check_sample_budget.py build/samples/processed/manifest.json --output build/wasm/target-sample-budget.json
      - name: Build shared ReFmB1rth WASM runtime
        run: sh web/emu/build_wasm.sh
      - name: Smoke-check browser harness
        run: |
          test -s build/wasm/index.html
          test -s build/wasm/worklet.html
          test -s build/wasm/worklet_client.js
          test -s build/wasm/refm_audio_worklet.js
          test -s build/wasm/refm.js
          test -s build/wasm/refm.wasm
          test -s build/wasm/sample_controls.js
          test -s build/wasm/fx_board.js
          test -s build/wasm/rebirth_skin.css
          test -s build/wasm/rebirth_skin.js
          test -s build/wasm/sample-manifest.json
          test -s build/wasm/sample-lock.json
          test -s build/wasm/target-sample-budget.json
          grep -q "import createRefm from './refm.js'" build/wasm/index.html
          grep -q "rebirth_skin.css" build/wasm/index.html
          grep -q "installRebirthSkin" build/wasm/index.html
          grep -q "sample_controls.js" build/wasm/index.html
          grep -q "installFxBoard" build/wasm/sample_controls.js
          grep -q "REVERB" build/wasm/fx_board.js
          grep -q "ReFmWorkletClient" build/wasm/worklet.html
          grep -q "registerProcessor('refm-audio'" build/wasm/refm_audio_worklet.js
          grep -q "_refm_wasm_render" build/wasm/refm.js
          grep -q "_refm_wasm_enable_samples" build/wasm/refm.js
          grep -q "_refm_wasm_set_acid_wave" build/wasm/refm.js
      - name: Record checksums
        run: |
          cd build/wasm
          sha256sum index.html worklet.html worklet_client.js refm_audio_worklet.js refm.js refm.wasm sample_controls.js fx_board.js rebirth_skin.css rebirth_skin.js sample-manifest.json sample-lock.json target-sample-budget.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: refm-wasm-${{ github.sha }}
          path: |
            build/wasm/index.html
            build/wasm/worklet.html
            build/wasm/worklet_client.js
            build/wasm/refm_audio_worklet.js
            build/wasm/refm.js
            build/wasm/refm.wasm
            build/wasm/sample_controls.js
            build/wasm/fx_board.js
            build/wasm/rebirth_skin.css
            build/wasm/rebirth_skin.js
            build/wasm/sample-manifest.json
            build/wasm/sample-lock.json
            build/wasm/target-sample-budget.json
            build/wasm/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  fm1-target:
    name: FM-1 target package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git xz-utils python3-pip
          python3 -m pip install --user Pillow fonttools
      - name: Prepare exact Felucca 1.0.5 foundation
        run: tools/bootstrap_felucca.sh .upstream/felucca
      - name: Verify pinned Felucca integration anchors
        run: python3 tools/verify_felucca_integration.py .upstream/felucca
      - name: Apply deterministic ReFmB1rth overlay and compact UI
        run: |
          python3 tools/apply_felucca_overlay.py .upstream/felucca --check
          python3 tools/patch_fm1_rebirth_ui.py .upstream/felucca
      - name: Download JieLi pi32v2 toolchain
        run: .upstream/felucca/tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Fetch pinned AC79 SDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          SDK_TAG=AC79NN_SDK_V1.2.1_2023-12-13
          SDK_DIR="$RUNNER_TEMP/ac79"
          for attempt in 1 2 3; do
            rm -rf "$SDK_DIR"
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 clone --depth 1 --single-branch --branch "$SDK_TAG" "$SDK_URL" "$SDK_DIR"; then
              git -C "$SDK_DIR" rev-parse HEAD
              exit 0
            fi
            echo "AC79 SDK fetch attempt $attempt failed"
            sleep $((attempt * 5))
          done
          echo "AC79 SDK fetch failed after 3 attempts" >&2
          exit 1
      - name: Build FM-1 app, loader and FWSC package
        working-directory: .upstream/felucca
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
          AC79_SDK: ${{ runner.temp }}/ac79
        run: ./build.sh
      - name: Enforce FM-1 target memory budgets
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
        run: |
          mkdir -p build/target
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t .upstream/felucca/build/felucca.elf > build/target/felucca.syms
          python3 tools/check_target_budget.py .upstream/felucca/build/felucca.bin build/target/felucca.syms --output build/target/target-memory.json
      - name: Create and verify experimental release manifest
        run: |
          cp .upstream/felucca/build/felucca.fwsc build/target/TheReFmB1rth-experimental.fwsc
          cp .upstream/felucca/build/felucca.bin build/target/TheReFmB1rth-app.bin
          cp .upstream/felucca/build/loader/ota.bin build/target/ota.bin
          cp .upstream/felucca/.refm-overlay build/target/refm-overlay.txt
          cp .upstream/felucca/.refm-ui-overlay build/target/refm-ui-overlay.txt
          python3 tools/release_manifest.py build/target/TheReFmB1rth-experimental.fwsc --commit "${GITHUB_SHA}" --output build/target/manifest.json
          python3 tools/release_manifest.py build/target/TheReFmB1rth-experimental.fwsc --verify build/target/manifest.json
          (
            cd build/target
            sha256sum TheReFmB1rth-experimental.fwsc TheReFmB1rth-app.bin ota.bin > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Prepare conservative sample link-size experiment
        run: |
          python3 tools/fetch_samples.py
          python3 tools/preprocess_samples.py --rate 22050 --selection samples/target-candidates.json --out-dir build/target-samples
          python3 tools/check_sample_budget.py build/target-samples/manifest.json --output build/target/sample-experiment-selection.json
          tools/bootstrap_felucca.sh .upstream/felucca-samples
          python3 tools/verify_felucca_integration.py .upstream/felucca-samples
          python3 tools/apply_felucca_overlay.py .upstream/felucca-samples --check
          python3 tools/patch_fm1_rebirth_ui.py .upstream/felucca-samples
          python3 tools/inject_target_sample_experiment.py .upstream/felucca-samples build/target-samples
      - name: Build sample link-size experiment (not a release package)
        working-directory: .upstream/felucca-samples
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
          AC79_SDK: ${{ runner.temp }}/ac79
        run: ./build.sh
      - name: Measure sample candidate target delta
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
        run: |
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t .upstream/felucca-samples/build/felucca.elf > build/target/felucca-sample-experiment.syms
          python3 tools/check_target_budget.py .upstream/felucca-samples/build/felucca.bin build/target/felucca-sample-experiment.syms --output build/target/sample-experiment-memory.json
          cp .upstream/felucca-samples/build/felucca.bin build/target/TheReFmB1rth-sample-link-experiment.bin
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('build/target/target-memory.json').read_text())
          b=json.loads(Path('build/target/sample-experiment-memory.json').read_text())
          s=json.loads(Path('build/target/sample-experiment-selection.json').read_text())
          out={'pcm_bytes':s['candidate_pcm_bytes'],'xip_delta':b['xip']['used']-a['xip']['used'],'ram_delta':b['ram']['used']-a['ram']['used'],'pool_delta':b['pool']['used']-a['pool']['used'],'baseline':a,'sample_experiment':b}
          Path('build/target/sample-experiment-delta.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ('pcm_bytes','xip_delta','ram_delta','pool_delta')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: refm-fm1-experimental-${{ github.sha }}
          path: |
            build/target/TheReFmB1rth-experimental.fwsc
            build/target/TheReFmB1rth-app.bin
            build/target/ota.bin
            build/target/manifest.json
            build/target/refm-overlay.txt
            build/target/refm-ui-overlay.txt
            build/target/SHA256SUMS
            build/target/target-memory.json
            build/target/felucca.syms
            build/target/sample-experiment-selection.json
            build/target/sample-experiment-memory.json
            build/target/sample-experiment-delta.json
            build/target/TheReFmB1rth-sample-link-experiment.bin
            build/target/felucca-sample-experiment.syms
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish FM-1 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [host, fm1-target]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified FM-1 artifact from this build
        uses: actions/download-artifact@v4
        with:
          name: refm-fm1-experimental-${{ github.sha }}
          path: release

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TheReFmB1rth-experimental.fwsc
          test -s release/TheReFmB1rth-app.bin
          test -s release/ota.bin
          test -s release/manifest.json
          test -s release/SHA256SUMS
          test -s release/target-memory.json
          (cd release && sha256sum -c SHA256SUMS)

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## TheReFmB1rth ${GITHUB_REF_NAME}

          **Experimental FM-1 hardware-test firmware. Keep a known-good recovery path available before flashing.**

          Built from commit \`${GITHUB_SHA}\` using the pinned Felucca/JieLi toolchain. The package passed the repository's host DSP tests, target build, target memory budget and release-manifest/checksum verification before publication.

          ### Included
          - ACID A + ACID B 303-style engines
          - SAW / SQUARE, cutoff, resonance, Env Mod, decay and accent
          - per-ACID distortion
          - 16-step sequencing with NOTE / REST / TIE, Accent and Slide
          - 808 + 909-inspired drum engines
          - A-H pattern bank and song sequencing
          - mixer, delay and reverb sends
          - MIDI control and live web-editor integration
          - compact 240x240 FM-1 UI work in progress
          - browser installer support for this release asset

          ### Install asset
          - \`TheReFmB1rth-experimental.fwsc\` — FM-1 update package used by the web installer

          ### Verification / diagnostics
          - \`SHA256SUMS\`
          - \`manifest.json\`
          - \`target-memory.json\`
          - \`refm-overlay.txt\`
          - \`refm-ui-overlay.txt\`

          ### Hardware-test status
          This remains an experimental hardware build. Do not treat it as a stable release until physical FM-1 CPU/underrun, UI, MIDI, persistence and recovery tests have passed.
          EOF

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXTRA=()
          case "$TAG" in
            hardware-test-*|*-alpha*|*-beta*|*-rc*) EXTRA+=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TheReFmB1rth $TAG" \
            --notes-file release-notes.md \
            "${EXTRA[@]}" \
            release/TheReFmB1rth-experimental.fwsc \
            release/TheReFmB1rth-app.bin \
            release/ota.bin \
            release/manifest.json \
            release/SHA256SUMS \
            release/target-memory.json \
            release/refm-overlay.txt \
            release/refm-ui-overlay.txt
