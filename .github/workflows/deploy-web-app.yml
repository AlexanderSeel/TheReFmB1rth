name: Deploy FM-1 web app

on:
  push:
    branches: [main]
    paths:
      - 'web/app/**'
      - 'web/emu/**'
      - 'web/refm.js'
      - 'web/worklet_client.js'
      - 'firmware/proto/**'
      - 'firmware/integration/**'
      - 'tools/generate_303_wavetables.py'
      - 'tools/generate_303_hq_wavetables.py'
      - 'tools/fetch_samples.py'
      - 'tools/preprocess_samples.py'
      - 'samples/**'
      - '.github/workflows/deploy-web-app.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wasm-web-channel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Prepare approved browser samples
        run: |
          python3 tools/fetch_samples.py
          python3 tools/preprocess_samples.py --rate 22050
      - name: Build combined installer/editor/virtual FM-1
        run: sh web/emu/build_wasm.sh
      - name: Validate deployable WASM app
        run: |
          test -s build/wasm/refm.js
          test -s build/wasm/refm.wasm
          test -s build/wasm/worklet_client.js
          test -s build/wasm/refm_audio_worklet.js
          test -s build/wasm/wasm-channel.json
          test -s build/wasm/app/index.html
          test -s build/wasm/app/virtual_fm1.js
          test -s build/wasm/app/latest_wasm.js
          grep -q 'DOWNLOAD LATEST WASM' build/wasm/app/latest_wasm.js
          grep -q 'cdn.jsdelivr.net/gh/AlexanderSeel/TheReFmB1rth@wasm-channel' build/wasm/app/latest_wasm.js
          grep -q 'latest_wasm.js' build/wasm/app/index.html
          grep -q 'data-tab="virtual"' build/wasm/app/index.html
          grep -q '_refm_wasm_panel_value' build/wasm/refm.js
          node --check build/wasm/app/virtual_fm1.js
          node --check build/wasm/app/latest_wasm.js
      - name: Publish CORS-safe WASM channel branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/wasm-channel"
          mkdir -p "$RUNNER_TEMP/wasm-channel"
          cp build/wasm/refm.js "$RUNNER_TEMP/wasm-channel/"
          cp build/wasm/refm.wasm "$RUNNER_TEMP/wasm-channel/"
          cp build/wasm/worklet_client.js "$RUNNER_TEMP/wasm-channel/"
          cp build/wasm/refm_audio_worklet.js "$RUNNER_TEMP/wasm-channel/"
          cp build/wasm/wasm-channel.json "$RUNNER_TEMP/wasm-channel/"
          cp build/wasm/SHA256SUMS "$RUNNER_TEMP/wasm-channel/"
          cd "$RUNNER_TEMP/wasm-channel"
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b wasm-channel
          git add .
          git commit -m "wasm channel ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:wasm-channel
      - name: Configure GitHub Pages when repository Pages is enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wasm

  deploy:
    if: needs.build.outputs.pages_ready == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
