name: Beta8 audio validation dispatcher

on:
  push:
    branches: [work/audio-clean-beta8]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full Build all artifacts on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-all.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
